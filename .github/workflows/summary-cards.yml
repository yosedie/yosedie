name: Generate Summary Cards

# Generates commit-rhythm cards (productive hours, most-committed languages)
# into profile-summary-cards/ and embeds them in README.md.

on:
  schedule:
    - cron: "5 1 * * 1" # weekly, Monday 01:05 UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards (all themes — tokyonight for README, github for website)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 7
          AUTO_PUSH: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/
          git commit -m "chore: update profile summary cards" || echo "no changes"
          # other card workflows may push main concurrently — rebase and retry
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            git pull --rebase origin main || true
            sleep $((i * 3))
          done
          git push

name: Generate Summary Cards

# Generates commit-rhythm cards (productive hours, most-committed languages)
# into profile-summary-cards/ and embeds them in README.md.

on:
  schedule:
    - cron: "5 1 * * 1" # weekly, Monday 01:05 UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards (tokyonight — for README profile)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: tokyonight
          UTC_OFFSET: 7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate cards (github_light — for website)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github_light
          UTC_OFFSET: 7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

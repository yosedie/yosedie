<svg xmlns="http://www.w3.org/2000/svg" width="880" height="4" viewBox="0 0 880 4" role="img" aria-label="divider">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.5" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#4F46E5"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="880" height="4" rx="2" fill="url(#flow)"/>
</svg>
